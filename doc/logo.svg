<svg width="260" height="260" viewBox="0 0 260 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glow" cx="50%" cy="45%" r="60%">
      <stop offset="0" stop-color="#39ff8f" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#060a10" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#39ff8f"/>
      <stop offset="0.5" stop-color="#00e5ff"/>
      <stop offset="1" stop-color="#ff2fb0"/>
    </linearGradient>
    <filter id="lg" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="130" cy="130" r="128" fill="#060a10"/>
  <circle cx="130" cy="130" r="128" fill="url(#glow)"/>
  <circle cx="130" cy="130" r="122" fill="none" stroke="url(#ring)" stroke-width="2.5" stroke-dasharray="6 5">
    <animateTransform attributeName="transform" type="rotate" from="0 130 130" to="360 130 130" dur="24s" repeatCount="indefinite"/>
  </circle>
  <circle cx="130" cy="130" r="104" fill="none" stroke="#00e5ff" stroke-opacity="0.35" stroke-width="1">
    <animateTransform attributeName="transform" type="rotate" from="360 130 130" to="0 130 130" dur="18s" repeatCount="indefinite"/>
  </circle>

  <!-- magnifier ring around the fingerprint -->
  <g transform="translate(130,124)">
    <!-- fingerprint arcs -->
    <g stroke-linecap="round" fill="none" filter="url(#lg)">
      <path d="M0,-52 a52,52 0 1 1 -0.1,0" stroke="#39ff8f" stroke-width="3"><animate attributeName="stroke-dasharray" values="0,330;330,0" dur="4s" repeatCount="indefinite"/></path>
      <path d="M0,-40 a40,40 0 1 1 -0.1,0" stroke="#00e5ff" stroke-width="3"><animate attributeName="stroke-dasharray" values="0,252;252,0" dur="4s" begin="0.25s" repeatCount="indefinite"/></path>
      <path d="M0,-28 a28,28 0 1 1 -0.1,0" stroke="#ff2fb0" stroke-width="3"><animate attributeName="stroke-dasharray" values="0,176;176,0" dur="4s" begin="0.5s" repeatCount="indefinite"/></path>
      <path d="M0,-16 a16,16 0 1 1 -0.1,0" stroke="#00e676" stroke-width="3"><animate attributeName="stroke-dasharray" values="0,100;100,0" dur="4s" begin="0.75s" repeatCount="indefinite"/></path>
      <circle r="3.4" fill="#c9f7e2"/>
    </g>
  </g>

  <!-- magnifying glass overlay -->
  <g transform="translate(150,110) rotate(20)" filter="url(#lg)">
    <circle r="30" fill="#060a10" fill-opacity="0.05" stroke="#00e5ff" stroke-width="4"/>
    <line x1="21" y1="21" x2="46" y2="46" stroke="#00e5ff" stroke-width="7" stroke-linecap="round"/>
  </g>

  <text x="130" y="220" text-anchor="middle" font-family="'Courier New', ui-monospace, monospace" font-weight="700" font-size="30" fill="url(#ring)" filter="url(#lg)" letter-spacing="5">ISA</text>
  <text x="130" y="238" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="10.5" fill="#c9f7e2" opacity="0.8" letter-spacing="1.5">STACK&#160;ANALYZER</text>
</svg>
